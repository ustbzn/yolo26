# YOLO26 object detection model — DLA 部署专用变体 (P3/8 - P5/32 outputs)
# 相对 yolo26-timer.yaml 的改动：去掉网络中段两处动态 MatMul 注意力，使其可跑 NVIDIA Orin DLA。
#   - 第 10 层 C2PSA            -> C3k2(c3k=True)   (PSABlock 含动态 q@k / v@attn，DLA 不支持)
#   - 第 22 层 C3k2(attn=True)  -> C3k2(c3k=True)   (去掉 attn，保留 c3k)
# Detect (第 23 层) 保持 end2end=True 不变，其 topk/gather 在 TensorRT 构建时 GPU 回退。
# 需重新训练。
# Model docs: https://docs.ultralytics.com/models/yolo26
# Task docs: https://docs.ultralytics.com/tasks/detect

# Parameters
nc: 10 # number of classes  trafic_light

end2end: True # whether to use end-to-end mode (Detect 尾部 topk/gather 走 GPU 回退)
reg_max: 1 # DFL bins (=1 时 DFL 为 Identity，无 softmax，DLA 友好)
scales: # model compound scaling constants, i.e. 'model=yolo26n.yaml' will call yolo26.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO26n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 9
  - [-1, 2, C3k2, [1024, True]] # 10 (was C2PSA — 去注意力，DLA 友好)

# YOLO26n head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 2, C3k2, [512, True]] # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 2, C3k2, [256, True]] # 16 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]] # cat head P4
  - [-1, 2, C3k2, [512, True]] # 19 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]] # cat head P5
  - [-1, 1, C3k2, [1024, True]] # 22 (P5/32-large) (was attn=True — 去注意力，DLA 友好)

  - [[16, 19, 22], 1, Detect, [nc]] # Detect(P3, P4, P5)
